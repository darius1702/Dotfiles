[main]
term = xterm-256color
font = FixederSysLight2x:size=12
pad  = 10x10 center

include = ~/.config/foot/standard_dark_ef_reverie
initial-color-theme = dark

[scrollback]
lines = 100000

[bell]
system = no

[key-bindings]
color-theme-toggle = F12
scrollback-up-half-page = Control+Shift+p
scrollback-down-half-page = Control+Shift+n
spawn-terminal = none
